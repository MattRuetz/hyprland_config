# Application bindings
bindd = SUPER, RETURN, Terminal, exec, uwsm-app -- xdg-terminal-exec --dir="$(omarchy-cmd-terminal-cwd)"
bindd = SUPER ALT, RETURN, Tmux, exec, uwsm-app -- xdg-terminal-exec --dir="$(omarchy-cmd-terminal-cwd)" bash -c "tmux attach || tmux new -s Work"
bindd = SUPER SHIFT, RETURN, Browser, exec, omarchy-launch-browser
bindd = SUPER SHIFT, F, File manager, exec, uwsm-app -- nautilus --new-window
bindd = SUPER ALT SHIFT, F, File manager (cwd), exec, uwsm-app -- nautilus --new-window "$(omarchy-cmd-terminal-cwd)"
bindd = SUPER SHIFT, B, Browser, exec, omarchy-launch-browser
bindd = SUPER SHIFT ALT, B, Browser (private), exec, omarchy-launch-browser --private
bindd = SUPER SHIFT, M, Music, exec, omarchy-launch-or-focus spotify
bindd = SUPER SHIFT ALT, M, Music TUI, exec, omarchy-launch-or-focus-tui cliamp
bindd = SUPER SHIFT, N, Editor, exec, omarchy-launch-editor
bindd = SUPER SHIFT, D, Docker, exec, omarchy-launch-tui lazydocker
bindd = SUPER SHIFT, G, Signal, exec, omarchy-launch-or-focus ^signal$ "uwsm-app -- signal-desktop"
bindd = SUPER SHIFT, O, Obsidian, exec, omarchy-launch-or-focus ^obsidian$ "uwsm-app -- obsidian"
bindd = SUPER SHIFT, W, Typora, exec, uwsm-app -- typora --enable-wayland-ime
bindd = SUPER SHIFT, SLASH, Passwords, exec, uwsm-app -- 1password

# If your web app url contains #, type it as ## to prevent hyprland treating it as a comment
bindd = SUPER SHIFT, A, ChatGPT, exec, omarchy-launch-webapp "https://chatgpt.com"
bindd = SUPER SHIFT ALT, A, Grok, exec, omarchy-launch-webapp "https://grok.com"
bindd = SUPER SHIFT, C, Calendar, exec, omarchy-launch-webapp "https://app.hey.com/calendar/weeks/"
bindd = SUPER SHIFT, E, Email, exec, omarchy-launch-webapp "https://app.hey.com"
bindd = SUPER SHIFT, Y, YouTube, exec, omarchy-launch-webapp "https://youtube.com/"
bindd = SUPER SHIFT ALT, G, WhatsApp, exec, omarchy-launch-or-focus-webapp WhatsApp "https://web.whatsapp.com/"
bindd = SUPER SHIFT CTRL, G, Google Messages, exec, omarchy-launch-or-focus-webapp "Google Messages" "https://messages.google.com/web/conversations"
bindd = SUPER SHIFT, P, Google Photos, exec, omarchy-launch-or-focus-webapp "Google Photos" "https://photos.google.com/"
bindd = SUPER SHIFT, X, X, exec, omarchy-launch-webapp "https://x.com/"
bindd = SUPER SHIFT ALT, X, X Post, exec, omarchy-launch-webapp "https://x.com/compose/post"

# ── Custom bindings from old config ──

# Unbind omarchy defaults that conflict with old keybindings
unbind = SUPER, ESCAPE        # was: System menu
unbind = SUPER, O             # was: Pop window out (float & pin)
unbind = SUPER, J             # was: Toggle window split
unbind = SUPER, S             # was: Toggle scratchpad
unbind = SUPER, SPACE         # was: Launch apps
unbind = SUPER, F             # was: Full screen

# SUPER+SPACE → close window, SUPER+F → app launcher
bindd = SUPER, SPACE, Close window, killactive
bindd = SUPER, F, Launch apps, exec, omarchy-launch-walker

# Vim-style focus movement (SUPER + H/J/K/L)
bindd = SUPER, H, Focus left, movefocus, l
bindd = SUPER, L, Focus right, movefocus, r
bindd = SUPER, J, Focus up, movefocus, u
bindd = SUPER, K, Focus down, movefocus, d

# App launchers
bindd = SUPER, Z, Zen Browser, exec, zen-browser
bindd = SUPER, E, Emoji picker, exec, smile
bindd = SUPER, N, Notification center, exec, swaync-client -t -sw
bindd = SUPER, O, Obsidian, exec, obsidian
bindd = SUPER, G, GPT4All, exec, flatpak run io.gpt4all.gpt4all
bindd = SUPER, D, File manager, exec, nautilus
unbind = SUPER, W             # was: Close window (using SUPER+SPACE instead)
unbind = SUPER SHIFT, W       # was: Typora
bindd = SUPER, W, Next painting, exec, /home/matt/.local/bin/classical-paintings-next
bindd = SUPER SHIFT, W, Remove painting & next, exec, /home/matt/.local/bin/classical-paintings-remove

unbind = SUPER, T             # was: Toggle window floating/tiling (tiling-v2)
bindd = SUPER, T, Toggle floating, togglefloating
unbind = SUPER, X             # was: Universal cut
bindd = SUPER, X, cdsp, exec, alacritty -e /home/matt/.local/bin/cdsp
unbind = SUPER, C             # was: Universal copy
bindd = SUPER, C, Chromium, exec, uwsm-app -- chromium
bindd = SUPER, ESCAPE, Lock screen, exec, hyprlock
bindd = SUPER, M, Logout, exec, omarchy-system-logout
bindd = SUPER CTRL, N, Toggle nightlight, exec, omarchy-toggle-nightlight
bindd = SUPER, F2, Night light warmer, exec, /home/matt/.local/bin/nightlight-adjust temp down
bindd = SUPER, F3, Night light cooler, exec, /home/matt/.local/bin/nightlight-adjust temp up
bindd = SUPER SHIFT, F2, Night light dimmer, exec, /home/matt/.local/bin/nightlight-adjust brightness down
bindd = SUPER SHIFT, F3, Night light brighter, exec, /home/matt/.local/bin/nightlight-adjust brightness up

# Dictation (toggle: OFF ↔ ON)
unbind = SUPER, V             # was: Universal paste
bindd = SUPER, V, Toggle dictation, exec, /home/matt/.local/bin/dictation-toggle
bindd = SUPER, Multi_key, Clipboard history, exec, omarchy-launch-walker -m clipboard

# Scratchpad
unbind = SUPER, TAB            # was: Next workspace
unbind = SUPER SHIFT, TAB      # was: Previous workspace
bindd = SUPER, TAB, Toggle scratchpad, togglespecialworkspace, magic
bindd = SUPER SHIFT, TAB, Move to scratchpad, movetoworkspace, special:magic

# True fullscreen (edge to edge, no gaps/borders/waybar)
bindd = SUPER CTRL SHIFT, F, Full screen, fullscreen, 0

# Mouse forward/back buttons → switch workspace on current monitor (like 3-finger swipe)
bindd = , mouse:276, Next workspace (mouse fwd), workspace, r+1
bindd = , mouse:275, Previous workspace (mouse back), workspace, r-1

