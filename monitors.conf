# See https://wiki.hyprland.org/Configuring/Monitors/
# List current monitors and resolutions possible: hyprctl monitors
# Format: monitor = [port], resolution, position, scale

# HP V28 4K main monitor (left side — effective 2560x1440)
env = GDK_SCALE,2
monitor = DP-1, preferred, 0x0, 1.5

# Laptop display (right of HP)
monitor = eDP-1, preferred, 2560x0, 2

# Miracast virtual output (streamed to MiraScreen dongle)
monitor = HEADLESS-2, 1920x1080@60, 5120x0, 1
